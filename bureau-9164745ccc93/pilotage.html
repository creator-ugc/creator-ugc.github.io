const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function ouvrir(pw,auto){
  try{
    const b=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:310000,hash:"SHA-256"},b,{name:"AES-GCM",length:256},false,["decrypt"]);
    const h=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},k,u(D.c)));
    try{sessionStorage.setItem("bureau_pw",pw)}catch(e){}
    document.open();document.write(h);document.close();
  }catch(e){if(!auto)document.getElementById("err").textContent="Mot de passe incorrect.";}
}
document.getElementById("f").onsubmit=e=>{e.preventDefault();ouvrir(document.getElementById("pw").value)};

</script></body></html>
