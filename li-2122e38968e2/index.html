<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: #1f6e8c; font-family: Manrope, system-ui, -apple-system, sans-serif; color: #1f2a30; padding: 24px 16px 48px; }
main { max-width: 1400px; margin: 0 auto; min-width: 0; } h1 { color: #fff; font-size: clamp(18px, 4vw, 22px); margin: 0 0 14px; }
.thib { overflow: hidden; }
.thib { background: #fff; color: #1f2a30; border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.thib h3 { margin: 0 0 10px; }
.thib-t { overflow-x: auto; } .thib table { border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; width: 100%; }
.thib th, .thib td { padding: 6px 3px; border-bottom: 1px solid #eee9e1; text-align: right; white-space: nowrap; }
.thib thead th { font-size: 11px; color: #5b6870; font-weight: 600; } .thib tbody th { text-align: left; font-weight: 700; position: sticky; left: 0; background: #fff; padding-right: 12px; }
.thib .tot { font-weight: 800; background: #f4f2ee; } .thib tr.sous th { font-weight: 500; padding-left: 16px; color: #3d4a52; } .thib tr.sous td { color: #3d4a52; font-size: 11px; }
.thib tr.p4 th, .thib tr.p4 td { background: #fff7d1; } .thib tr.p5 th, .thib tr.p5 td { background: #ffe8cc; } .thib tr.p6 th, .thib tr.p6 td { background: #ffd2a8; } .thib tr.p7 th, .thib tr.p7 td { background: #ffe0e0; } .thib tr.pct td, .thib tr.pct th { color: #5b6870; font-size: 10.5px; }
.thib-c { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0 8px; font-size: 13px; }
.thib-p { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; padding: 5px 12px; border-radius: 999px; border: 1px solid #e3e0da; background: #faf9f6; user-select: none; }
.thib-p input { display: none; } .thib-p i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.thib-p small { color: #8a949a; font-size: 11px; } .thib-p:has(input:not(:checked)) { opacity: .45; background: #fff; } .thib-p:has(input:not(:checked)) i { background: #ced4da; }
.thib-g { width: 100%; height: auto; display: block; } .thib-h { fill: transparent; cursor: crosshair; } .thib-h:hover { fill: #0000000a; }
.thib.sans-vues .s-vues, .thib.sans-posts .s-posts, .thib.sans-vis .s-vis, .thib.sans-abo .s-abo { display: none; }
.thib-n { font-size: 11px; color: #5b6870; margin: 6px 0 0; }

.thib h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: #5b6870; }
</style></head><body><main><h1>LinkedIn de Thibaut · MeilleursJobs</h1><div id="app"></div></main>
<script>
const nf = new Intl.NumberFormat("fr-FR");
const compact = n => n >= 999500 ? (n / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " M"
  : n >= 1e4 ? Math.round(n / 1e3).toLocaleString("fr-FR") + " k" : nf.format(Math.round(n));
const jjmm = d => d.slice(8, 10) + "/" + d.slice(5, 7);
  // LinkedIn de Thibaut (fiche de Théo, 26/11) : tableau horizontal (dates en colonnes) puis courbes à cocher
  const ligneThibaut = L => {
    const nf2 = new Intl.NumberFormat("fr-FR"), pc = (a, b) => b ? (100 * a / b).toLocaleString("fr-FR", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + "%" : "–";
    const sm = k => L.reduce((a, x) => a + (x[k] || 0), 0);
    const T = { li_vues: sm("li_vues"), li_posts: sm("li_posts"), vis_li: sm("vis_li"), abo_li: sm("abo_li"), abo_c: sm("abo_c"), abo_cv: sm("abo_cv"), abo_cvp: sm("abo_cvp"), abo_e: sm("abo_e") };
    const lignes = [["Vues", x => compact(x.li_vues), compact(T.li_vues)], ["Posts", x => x.li_posts, T.li_posts],
      ["Arrivées sur la LP (/l)", x => nf2.format(x.vis_li), nf2.format(T.vis_li)], ["Abonnements pris (/l)", x => nf2.format(x.abo_li), nf2.format(T.abo_li)],
      ["dont Candidature", x => x.abo_c || "·", T.abo_c], ["dont CV essai (2,95 €)", x => x.abo_cv || "·", T.abo_cv], ["dont CV payé", x => x.abo_cvp || "·", T.abo_cvp], ["dont Entretien", x => x.abo_e || "·", T.abo_e],
      ["% arrivées / vues", x => pc(x.vis_li, x.li_vues), pc(T.vis_li, T.li_vues)], ["% abonnements / arrivées", x => pc(x.abo_li, x.vis_li), pc(T.abo_li, T.vis_li)]];

    const tab = `<table><thead><tr><th></th>${L.map(x => `<th>${x.j.slice(8, 10)}</th>`).join("")}<th class="tot">Total</th></tr></thead><tbody>${lignes.map(([n, f, t], i) =>
      `<tr class="${i >= 4 && i <= 7 ? "sous p" + i : i >= 8 ? "pct" : ""}"><th>${n}</th>${L.map(x => `<td>${f(x)}</td>`).join("")}<td class="tot">${t}</td></tr>`).join("")}</tbody></table>`;
    // courbes : chaque série sur sa propre échelle (0 → son max), lissées, sans déformation ; survol d'un jour = toutes les valeurs
    const S = [["vues", "Vues", "li_vues", "#0a66c2"], ["posts", "Posts", "li_posts", "#868e96"], ["vis", "Arrivées sur la LP", "vis_li", "#f76707"], ["abo", "Abonnements pris", "abo_li", "#2f9e44"]];
    const W = 1200, H = 360, PL = 16, PR = 16, PT = 18, PB = 34, n = L.length, X = i => PL + (n > 1 ? i * (W - PL - PR) / (n - 1) : 0);
    // lissage sans dépassement : les points de contrôle restent entre les deux points qu'ils relient (pas de creux sous zéro)
    const lisse = P => P.map((p, i) => { if (!i) return `M${p[0]},${p[1]}`; const a = P[i - 2] || P[i - 1], b = P[i - 1], c = p, d = P[i + 1] || p;
      const lo = Math.min(b[1], c[1]), hi = Math.max(b[1], c[1]), cl = v => Math.min(hi, Math.max(lo, v));
      return `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)},${cl(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (d[0] - b[0]) / 6).toFixed(1)},${cl(c[1] - (d[1] - b[1]) / 6).toFixed(1)} ${c[0].toFixed(1)},${c[1].toFixed(1)}`; }).join(" ");
    const grille = [0, .25, .5, .75, 1].map(f => `<line x1="${PL}" x2="${W - PR}" y1="${(PT + f * (H - PT - PB)).toFixed(1)}" y2="${(PT + f * (H - PT - PB)).toFixed(1)}" stroke="#efece6"/>`).join("")
      + L.map((x, i) => `<text x="${X(i).toFixed(1)}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#8a949a">${x.j.slice(8, 10)}</text>`).join("");
    const series = S.map(([id, nom, k, c]) => { const m = Math.max(1, ...L.map(x => x[k] || 0)), Y = v => H - PB - (v / m) * (H - PT - PB);
      const P = L.map((x, i) => [X(i), Y(x[k] || 0)]), d = lisse(P);
      const aire = id === "vues" ? `<path d="${d} L${P[P.length - 1][0]},${H - PB} L${P[0][0]},${H - PB} Z" fill="${c}" opacity=".08"/>` : "";
      return `<g class="s-${id}">${aire}<path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${P.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="${c}" stroke-width="2"/>`).join("")}</g>`; }).join("");
    const pas = n > 1 ? (W - PL - PR) / (n - 1) : W;
    const survol = L.map((x, i) => `<rect class="thib-h" x="${(X(i) - pas / 2).toFixed(1)}" y="${PT}" width="${pas.toFixed(1)}" height="${H - PT - PB}"><title>${jjmm(x.j)}\nVues : ${nf2.format(x.li_vues || 0)}\nPosts : ${x.li_posts || 0}\nArrivées sur la LP : ${nf2.format(x.vis_li || 0)}\nAbonnements pris : ${x.abo_li || 0}</title></rect>`).join("");
    const coches = S.map(([id, nom, k, c]) => `<label class="thib-p" style="--c:${c}"><input type="checkbox" checked onchange="this.closest('.thib').classList.toggle('sans-${id}', !this.checked)"><i></i>${nom}<small>max ${k === "li_vues" ? compact(Math.max(...L.map(x => x[k] || 0))) : nf2.format(Math.max(...L.map(x => x[k] || 0)))}</small></label>`).join("");
    return `<section class="thib"><h3>LinkedIn de Thibaut · du 1er au ${jjmm(L[L.length - 1].j)}</h3><div class="thib-t">${tab}</div>
      <div class="thib-c">${coches}</div><svg class="thib-g" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbes LinkedIn de Thibaut par jour">${grille}${series}${survol}</svg>
      <p class="thib-n">Vues = impressions LinkedIn du jour, tous posts confondus (même anciens). Posts = posts publiés ce jour-là (hors vidéos). Arrivées = personnes arrivées sur la LP par le lien meilleursjobs.com/l (PostHog, une fois par personne et par jour). Abonnements pris = abonnements payés ou essais démarrés ce jour-là (Candidature, CV essai à 2,95 €, CV payé — abonnement sans essai ou essai venu de /l passé payant ce jour-là —, Entretien), comptés pour /l si la personne a payé en arrivant par /l, était passée par /l dans les 24 h avant, ou avait créé son compte via /l. Sur le graphique, chaque courbe a sa propre échelle (de 0 à son maximum du mois, indiqué dans la légende) ; survol d'un jour = toutes les valeurs exactes.</p></section>`;
  };
document.getElementById("app").innerHTML = ligneThibaut([{"j": "2026-11-01", "li_posts": 0, "li_vues": 11718, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-02", "li_posts": 0, "li_vues": 9680, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-03", "li_posts": 1, "li_vues": 237834, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-04", "li_posts": 0, "li_vues": 317259, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-05", "li_posts": 0, "li_vues": 13779, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-06", "li_posts": 0, "li_vues": 9693, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-07", "li_posts": 0, "li_vues": 3889, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-08", "li_posts": 1, "li_vues": 64950, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-09", "li_posts": 3, "li_vues": 745422, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-10", "li_posts": 2, "li_vues": 1150129, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-11", "li_posts": 2, "li_vues": 637539, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-12", "li_posts": 1, "li_vues": 258327, "vis_li": 0, "abo_li": 0, "abo_c": 0, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-13", "li_posts": 1, "li_vues": 566801, "vis_li": 146, "abo_li": 4, "abo_c": 4, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-14", "li_posts": 1, "li_vues": 41923, "vis_li": 135, "abo_li": 2, "abo_c": 2, "abo_cv": 0, "abo_cvp": 0, "abo_e": 0}, {"j": "2026-11-15", "li_posts": 0, "li_vues": 28386, "vis_li": 65, "abo_li": 0, "abo_c": 0, "abo_cv"
