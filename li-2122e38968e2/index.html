<script>
const nf = new Intl.NumberFormat("fr-FR");
const compact = n => n >= 999500 ? (n / 1e6).toLocaleString("fr-FR", { maximumFractionDigits: 2 }) + " M"
  : n >= 1e4 ? Math.round(n / 1e3).toLocaleString("fr-FR") + " k" : nf.format(Math.round(n));
const jjmm = d => d.slice(8, 10) + "/" + d.slice(5, 7);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // liste des posts du mois sous les courbes (26/11) : clics (visites des liens) et % clics / vues, triable au clic sur l'en-tête
  const postsThibaut = PO => {
    if (!PO.length) return "";
    const nf2 = new Intl.NumberFormat("fr-FR"), pc = (a, b) => b && a != null ? (100 * a / b).toLocaleString("fr-FR", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + "%" : "–";
    const rows = [...PO].sort((a, b) => (b.clics ?? -1) - (a.clics ?? -1) || b.imp - a.imp).map(x => `<tr data-c="${x.clics ?? -1}" data-i="${x.imp}" data-t="${x.clics != null && x.imp ? x.clics / x.imp : -1}" data-d="${x.jour}">

      <td>${compact(x.imp)}</td><td><b>${x.clics == null ? "–" : nf2.format(x.clics)}</b></td><td>${pc(x.clics, x.imp)}</td></tr>`).join("");
    const th = (k, n) => `<th data-k="${k}" onclick="(t=>{const b=t.closest('table').tBodies[0],k=t.dataset.k,s=t.dataset.s=t.dataset.s==='1'?'-1':'1';[...b.rows].sort((x,y)=>(k==='d'?x.dataset.d.localeCompare(y.dataset.d):(+x.dataset[k])-(+y.dataset[k]))*(s==='1'?-1:1)).forEach(r=>b.appendChild(r))})(this)">${n} ↕</th>`;
    return `<h3 class="thib-st">Les posts du mois · clics sur le lien</h3><div class="thib-po"><table><thead><tr>${th("d", "Publié")}<th>Post</th>${th("i", "Vues")}${th("c", "Clics")}${th("t", "% clics / vues")}</tr></thead><tbody>${rows}</tbody></table></div>`;
  };
  // LinkedIn de Thibaut (fiche de Théo, 26/11) : tableau horizontal (dates en colonnes) puis courbes à cocher
  const ligneThibaut = (L, PO) => {
    const nf2 = new Intl.NumberFormat("fr-FR"), pc = (a, b) => b ? (100 * a / b).toLocaleString("fr-FR", { maximumFractionDigits: 2, minimumFractionDigits: 2 }) + "%" : "–";
    const sm = k => L.reduce((a, x) => a + (x[k] || 0), 0);
    const T = { vl: sm("vl"), li_vues: sm("li_vues"), li_posts: sm("li_posts"), vis_li: sm("vis_li"), abo_li: sm("abo_li"), abo_c: sm("abo_c"), abo_cv: sm("abo_cv"), abo_cvp: sm("abo_cvp"), abo_e: sm("abo_e") };
    const lignes = [["Vues", x => compact(x.li_vues), compact(T.li_vues)], ["Posts", x => x.li_posts, T.li_posts],
      ["Visites des liens (posts du jour)", x => x.vl == null ? "·" : nf2.format(x.vl), nf2.format(T.vl)], ["Arrivées sur la LP (/l)", x => nf2.format(x.vis_li), nf2.format(T.vis_li)], ["Abonnements pris (/l)", x => nf2.format(x.abo_li), nf2.format(T.abo_li)],

    const W = 1200, H = 360, PL = 16, PR = 16, PT = 18, PB = 34, n = L.length, X = i => PL + (n > 1 ? i * (W - PL - PR) / (n - 1) : 0);

    const coches = S.map(([id, nom, k, c]) => `<label class="thib-p" style="--c:${c}"><input type="checkbox" checked onchange="this.closest('.thib').classList.toggle('sans-${id}', !this.checked)"><i></i>${nom}<small>max ${k === "li_vues" ? compact(Math.max(...L.map(x => x[k] || 0))) : nf2.format(Math.max(...L.map(x => x[k] || 0)))}</small></label>`).join("");
    return `<section class="thib"><h3>LinkedIn de Thibaut · du 1er au ${jjmm(L[L.length - 1].j)}</h3><div class="thib-t">${tab}</div>

      ${postsThibaut(PO || [])}<p class="thib-n">Vues = impressions LinkedIn du jour, tous posts confondus (même anciens). Posts = posts publiés ce jour-là (hors vidéos). Visites des liens = clics sur le lien des posts publiés ce jour-là, cumulés depuis leur publication (export LinkedIn « Performances du post », mis à jour à chaque export). Arrivées = personnes arrivées sur la LP par le lien meilleursjobs.com/l (PostHog, une fois par personne et par jour). Abonnements pris = abonnements payés ou essais démarrés ce jour-là (Candidature, CV essai à 2,95 €, CV payé — abonnement sans essai ou essai venu de /l passé payant ce jour-là —, Entretien), comptés pour /l si la personne a payé en arrivant par /l, était passée par /l dans les 24 h avant, ou avait créé son compte via /l. Sur le graphique, chaque courbe a sa propre échelle (de 0 à son maximum du mois, indiqué dans la légende) ; survol d'un jour = toutes les valeurs exactes.</p></section>`;
  };
