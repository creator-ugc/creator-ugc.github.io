<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>UGC Creator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#F7F4EE; --dark:#1E2B23; --pink:#E9B4C7; --gold:#F2C94C; --muted:#6B7A72; --line:rgba(30,43,35,.10); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--cream);font-family:'Archivo',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--dark);
       padding:clamp(12px,3.5vw,32px) 16px 40px;-webkit-font-smoothing:antialiased}
  .sheet{max-width:640px;margin:0 auto}
  .head{background:var(--dark);color:var(--cream);text-align:center;border-radius:clamp(16px,3vw,24px);padding:clamp(24px,5vw,40px) 20px;margin-bottom:16px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
  h1{font-size:clamp(30px,8vw,48px);font-weight:900;letter-spacing:-.02em;line-height:1.05}
  h1 em{font-style:normal;color:var(--pink)}
  .cartes{display:grid;gap:10px}
  .carte{display:grid;gap:4px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;text-decoration:none;color:var(--dark)}
  .carte.actif{border:2px solid var(--dark)}
  .carte:hover{border-color:var(--dark)}
  .m{font-size:22px;font-weight:900;letter-spacing:-.01em}
  .s{font-size:13px;font-weight:600;color:var(--muted)}
  .v{font-size:14px;font-weight:800;margin-top:6px}
</style>
</head>
<body><div class="sheet">
<header class="head"><div class="eyebrow">Creator-Rankings</div><h1>UGC <em>Creator</em></h1></header>
<nav class="cartes"><a class="carte actif" href="../novembre/de/" ><span class="m">November 2026</span><span class="s">läuft, täglich aktualisiert</span><span class="v">Zum Ranking →</span></a><a class="carte" href="../octobre/de/" ><span class="m">Oktober 2026</span><span class="s">endgültig</span><span class="v">Zum Ranking →</span></a></nav>
</div></body></html>
